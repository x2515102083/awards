name: Prepare JSP-000281 catalog revision

on:
  push:
    branches: [prepare-jsp-000281-catalog]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Update only JSP-000281 formalization evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('problems/catalog-0201-0300.md')
          old = p.read_text(encoding='utf-8')
          start = old.index('<a id="JSP-000281"></a>')
          end = old.index('<a id="JSP-000282"></a>', start)
          block = old[start:end]
          assert block.count('| Lean proof | No |') == 1, 'Unexpected existing Lean record; stop rather than overwrite it.'
          assert '| Attribution basis |' not in block, 'Attribution already exists; manual reconciliation required.'
          sha = '0efb66fcc18ce26d38496e971a5d2b59d3dfa9b4'
          repo = 'https://github.com/x2515102083/erdos339-upper-density'
          pinned = f'{repo}/tree/{sha}'
          readme = f'{repo}/blob/{sha}/README.md'
          notice = f'{repo}/blob/{sha}/NOTICE'
          ci = f'{repo}/actions/runs/35229071831'
          upstream = 'https://github.com/plby/lean-proofs/blob/8822f7ddef30fadbd92e1c6ab4ed897af356af5e/src/latest/ErdosProblems/Erdos339.lean'
          lean = ('| Lean proof | Submitted for maintainer review: complete formalization of both original Erdős #339 clauses (basis/lower density and positive upper density), '
                  f'[public source]({pinned}), branch `complete-original-problem`, commit `{sha}`. '
                  '`Erdos339.erdos_339_complete` in `Erdos339/Complete.lean` combines '
                  '`Erdos339.erdos_339` and `Erdos339.erdos_339_upperDensity`; '
                  f'[build instructions]({readme}) and [commit-specific verification workflow]({ci}). '
                  'No award eligibility or official mathematical verification is asserted. |')
          attribution = ('| Attribution basis | Mathematics: Norbert Hegyvári, François Hennecart and Alain Plagne, '
                         '[HHP03](https://doi.org/10.1515/crll.2003.055). '
                         f'Reused finite and lower-density Lean proofs: Codex / GPT-5.6 Sol in [plby/lean-proofs]({upstream}); '
                         'see also [existing evidence #22](https://github.com/TheJustinSunPrize/awards/issues/22). '
                         'Incremental upper-density extension and full-statement integration: submitted by GitHub account `x2515102083` with AI assistance; '
                         f'[attribution and dependency/license limitations]({notice}). '
                         'No mathematical-solver credit, credit for reused proofs, or globally first priority is claimed. '
                         'Recipient identity remains unconfirmed (`RECIPIENT-JSP-000281-A`); no independent verifier is named. |')
          replacement = block.replace('| Lean proof | No |', lean + '\n' + attribution)
          assert '| Eligible to claim | No |' in replacement
          assert '| Current status | Solved |' in replacement
          p.write_text(old[:start] + replacement + old[end:], encoding='utf-8', newline='\n')
          # Self-remove the one-shot preparation workflow. The resulting tree
          # must differ from the pinned official base only in the catalog.
          Path('.github/workflows/prepare-jsp-000281-catalog.yml').unlink()
          print('Only the Lean proof and attribution rows for JSP-000281 were edited.')
          PY
      - name: Run official validation and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements.txt
          python3 scripts/manage.py validate
          python3 scripts/manage.py links
          python3 scripts/manage.py check
          python3 scripts/manage.py history --base 82be4c4913b8fe394d68d1391f4c221fde947211
          python3 -m unittest discover -s tests -v
      - name: Commit only the catalog-only prepared tree
        shell: bash
        run: |
          set -euo pipefail
          git add problems/catalog-0201-0300.md .github/workflows/prepare-jsp-000281-catalog.yml
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '82be4c4913b8fe394d68d1391f4c221fde947211'], text=True).splitlines()
          if paths != ['problems/catalog-0201-0300.md']:
              raise SystemExit(f'Unexpected final diff: {paths}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'catalog: reference complete Erdos 339 formalization with scoped attribution'
          git push origin HEAD:prepare-jsp-000281-catalog
          echo "PREPARED_COMMIT=$(git rev-parse HEAD)"
          echo "PREPARED_TREE=$(git rev-parse HEAD^{tree})"
          git diff --stat 82be4c4913b8fe394d68d1391f4c221fde947211 HEAD
